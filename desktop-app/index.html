<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>paladin</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand">
          <h1>paladin</h1>
          <div class="row">
            <button id="sidebarToggle" class="btn" title="Toggle sidebar">|</button>
          </div>
        </div>
        <div style="padding: 8px 12px 0">
          <button id="newSessionBtn" class="btn primary" style="width: 100%">New session</button>
          <input id="sessionSearch" placeholder="Search sessions…" />
        </div>
        <div id="sessionList"></div>
        <div class="side-foot">
          <div id="workspaceLabel" class="m" style="font-size: 11px; color: var(--muted)">no workspace</div>
          <div class="row">
            <button id="workspaceBtn" class="btn">Workspace</button>
            <button id="settingsBtn" class="btn">Settings</button>
          </div>
        </div>
      </aside>
      <div id="main">
        <div id="topbar">
          <button id="sidebarShow" class="btn" style="display: none">|</button>
          <h2 id="headerTitle">paladin</h2>
          <div id="tabs">
            <button class="tab" data-tab="agent">Agent</button>
            <button class="tab" data-tab="gemini">Gemini</button>
            <button class="tab" data-tab="chatgpt">ChatGPT</button>
          </div>
          <div style="flex: 1"></div>
          <button id="pageReloadBtn" class="btn" style="display: none">Reload</button>
        </div>
        <div id="chatView"><div id="messages"></div></div>
        <div id="externalHost"></div>
        <div id="composer">
          <div id="composerBox">
            <button id="modelBtn" class="btn" title="Pick model">model</button>
            <textarea id="promptInput" placeholder="Message the agent…"></textarea>
            <button id="sendBtn" class="btn primary">Send</button>
            <button id="pauseBtn" class="btn danger" style="display: none">Stop</button>
          </div>
          <div id="statusLine"></div>
        </div>
      </div>
    </div>

    <div id="sessionModal" class="modal-back"><div class="modal">
      <h3>New session</h3>
      <div class="field"><label>Workspace</label><div class="row"><input id="newSessionPath" style="flex:1" /><button id="browseBtn" class="btn">Browse</button></div></div>
      <div class="field"><label>Search models</label><input id="newSessionSearch" placeholder="filter…" /></div>
      <div id="newSessionTree" style="max-height: 300px; overflow: auto"></div>
      <div class="row" style="margin-top: 10px; justify-content: flex-end">
        <button id="newSessionClose" class="btn">Cancel</button>
        <button id="newSessionCreate" class="btn primary">Create</button>
      </div>
      <div id="browserList" style="margin-top: 10px"></div>
    </div></div>

    <div id="modelModal" class="modal-back"><div class="modal">
      <h3>Model</h3>
      <div class="field"><input id="modelSearch" placeholder="filter…" /></div>
      <div id="modelTree" style="max-height: 320px; overflow: auto"></div>
      <div class="row" style="margin-top: 10px; justify-content: flex-end"><button id="modelClose" class="btn">Close</button></div>
    </div></div>

    <div id="settingsModal" class="modal-back"><div class="modal">
      <h3>Providers</h3>
      <div id="providerList"></div>
      <div class="field"><label>Name</label><input id="provName" /></div>
      <div class="field"><label>API URL</label><input id="provUrl" /></div>
      <div class="field"><label>API key</label><input id="provKey" type="password" /></div>
      <div class="field"><label>Type</label><select id="provType"><option value="openai">openai</option><option value="anthropic">anthropic</option><option value="google">google</option></select></div>
      <div class="row" style="justify-content: flex-end">
        <button id="settingsClose" class="btn">Close</button>
        <button id="provAdd" class="btn primary">Add</button>
      </div>
    </div></div>

    <div id="confirmModal" class="modal-back"><div class="modal" style="width: 380px">
      <h3>Delete <span id="confirmTitle"></span>?</h3>
      <div class="row" style="justify-content: flex-end">
        <button id="confirmCancel" class="btn">Cancel</button>
        <button id="confirmDelete" class="btn danger">Delete</button>
      </div>
    </div></div>

    <div id="toast"></div>
  </body>
</html>
