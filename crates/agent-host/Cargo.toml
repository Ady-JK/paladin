[package]
name = "agent-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent-host"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../agent-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
